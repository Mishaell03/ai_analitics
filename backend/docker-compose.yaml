services:
  sandbox_runner:
    profiles: [sandbox]
    build:
      context: .
      dockerfile: infra/sandbox/runner.Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-analytics-sandbox:1.0}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-runc}
      SANDBOX_CONCURRENCY: ${SANDBOX_CONCURRENCY:-3}
      SANDBOX_HEAVY_CONCURRENCY: ${SANDBOX_HEAVY_CONCURRENCY:-1}
      SANDBOX_LOCK_FILE: /run/sandbox-runner/runner.lock
      SANDBOX_DB_HOST: postgres
      SANDBOX_DB_PORT: 5432
      SANDBOX_DB_PASSWORD: ${SANDBOX_DB_PASSWORD:-}
    volumes:
      - ${SANDBOX_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - sandbox_runner_state:/run/sandbox-runner
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"
    networks:
      - sandbox_net
      - data_net

  # Optional containerized API: no Docker socket, Docker CLI or host mounts.
  sandbox_api:
    profiles: [sandbox-api]

    build:
      context: .
      dockerfile: app/Dockerfile

    restart: unless-stopped
    init: true

    user: "65534:65534"
    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - ./app/.env

    environment:
      DB_HOST: postgres
      MINIO_ENDPOINT: minio:9000
      MINIO_MIGRATE_ON_STARTUP: "false"

      SANDBOX_RUNNER_ENDPOINT: http://sandbox_runner:8090
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-}
      SANDBOX_ASSIGNMENT_PROFILES: ${SANDBOX_ASSIGNMENT_PROFILES:-{}}

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev

    networks:
      - data_net
      - api_egress_net
      - sandbox_net

  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SANDBOX_DB_PASSWORD: ${SANDBOX_DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 20s
      retries: 5
    networks:
      - data_net

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    profiles:
      - dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data_net

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 20s
      retries: 5
    networks:
      - data_net

  minio_init:
    image: docker.io/pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infra/minio/seeds:/seeds
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};

      mc mb local/default-avatars --ignore-existing;
      mc mb local/avatars --ignore-existing;
      
      mc mb local/course-content --ignore-existing;

      mc cp --recursive /seeds/default-avatars/ local/default-avatars;
      mc cp --recursive /seeds/course-content/ local/course-content;
      "
    networks:
      - data_net

volumes:
  sandbox_runner_state:
  postgres_data:
  minio_data:

networks:
  sandbox_net:
    driver: bridge
  data_net:
    driver: bridge
    internal: true
  api_egress_net:
    driver: bridge
