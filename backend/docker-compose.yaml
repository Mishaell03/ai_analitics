services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 20s
      retries: 5
    networks:
      - data_net

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    profiles:
      - dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data_net

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 20s
      retries: 5
    networks:
      - data_net

  minio_init:
    image: docker.io/pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infra/minio/seeds:/seeds
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};

      mc mb local/default-avatars --ignore-existing;
      mc mb local/avatars --ignore-existing;
      
      mc mb local/course-content --ignore-existing;

      mc cp --recursive /seeds/default-avatars/ local/default-avatars;
      mc cp --recursive /seeds/course-content/ local/course-content;
      "
    networks:
      - data_net

  xray:
    image: ghcr.io/xtls/xray-core:latest
    container_name: xray-proxy
    restart: unless-stopped
    volumes:
      - ./infra/xray/config.json:/etc/xray/config.json:ro,Z
    command: [ "run", "-config", "/etc/xray/config.json" ]
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ai_backend_net
      - ai_egress_net

volumes:
  postgres_data:
  minio_data:

networks:
  data_net:
    driver: bridge
    internal: true
  ai_backend_net:
    driver: bridge
    internal: true
  ai_egress_net:
    driver: bridge