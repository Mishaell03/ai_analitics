services:
  #  TODO: в прод убрать робос портов в сеть
  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 20s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    profiles:
      - dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 20s
      retries: 5

  minio_init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infra/minio/seeds:/seeds
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};

      mc mb local/default-avatars --ignore-existing;
      mc mb local/avatars --ignore-existing;
      
      mc mb local/course-content --ignore-existing;
      mc mb local/module-content --ignore-existing;
      mc mb local/lesson-content --ignore-existing;
      mc mb local/lesson-videos --ignore-existing;
      mc mb local/lesson-assets --ignore-existing;
      mc mb local/datasets --ignore-existing;

      # приватный бак с медиафайлами курсов и уроков
      mc mb local/course-media --ignore-existing;
      
      mc cp --recursive /seeds/default-avatars/ local/default-avatars;
      mc cp --recursive /seeds/course-content/ local/course-content;
      mc cp --recursive /seeds/lesson-content/ local/lesson-content;
      "

volumes:
  postgres_data:
  minio_data:
